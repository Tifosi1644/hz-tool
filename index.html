<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成理核自学生会 · 办事通</title>
    <style>
        :root {
            --primary: #1a6fb5;
            --primary-dark: #14578a;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #666666;
            --border: #e8ecf1;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --accent-green: #27ae60;
            --accent-orange: #e67e22;
            --accent-red: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: linear-gradient(135deg, #1a6fb5 0%, #155d96 50%, #0f4c7d 100%);
            padding: 20px 20px 30px;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 0;
            right: 0;
            height: 40px;
            background: var(--bg);
            border-radius: 50% 50% 0 0;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(10px);
        }

        .header-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 400;
        }

        .search-box {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }
        .search-box .search-icon {
            font-size: 18px;
            color: #999;
            flex-shrink: 0;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: var(--text);
        }
        .search-box input::placeholder {
            color: #b0b8c1;
        }
        .search-clear {
            display: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ddd;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: #666;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
        }
        .search-clear.visible {
            display: flex;
        }

        .container {
            padding: 0 16px 40px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            margin-top: -10px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin: 24px 0 14px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px 16px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1.5px solid transparent;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .card:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14);
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .icon-blue {
            background: #e8f4fd;
            color: #1a6fb5;
        }
        .icon-green {
            background: #e8f8f0;
            color: #27ae60;
        }
        .icon-orange {
            background: #fef5ec;
            color: #e67e22;
        }
        .icon-red {
            background: #fdedec;
            color: #c0392b;
        }
        .icon-teal {
            background: #e8f8f5;
            color: #16a085;
        }

        .card h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }
        .card p {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .detail-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .detail-overlay.show {
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .detail-panel {
            background: #ffffff;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 82vh;
            overflow-y: auto;
            padding: 20px 20px 36px;
            animation: slideUp 0.3s ease;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.15);
        }
        .detail-handle {
            width: 40px;
            height: 5px;
            background: #ddd;
            border-radius: 3px;
            margin: 0 auto 20px;
        }
        .detail-panel h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .detail-panel .detail-category {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .detail-body {
            font-size: 14px;
            line-height: 1.8;
            color: #444;
        }
        .detail-body .step {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }
        .detail-body .step .step-num {
            font-weight: 700;
            color: var(--primary);
            font-size: 13px;
            display: inline-block;
            width: 24px;
        }
        .detail-body .highlight-box {
            background: #fff9e6;
            border-radius: 10px;
            padding: 12px 14px;
            margin: 12px 0;
            border: 1px solid #f0d77b;
            font-size: 13px;
        }
        .detail-body .highlight-box.blue {
            background: #e8f4fd;
            border-color: #a3cfee;
        }
        .detail-body a {
            color: var(--primary);
            text-decoration: underline;
            word-break: break-all;
        }
        .detail-close {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
        }
        .detail-close:active {
            background: var(--primary-dark);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #b0b8c1;
            font-size: 12px;
            margin-top: 10px;
        }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            display: none;
        }
        .no-result .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ==================== 头部 ==================== -->
    <div class="header">
        <div class="header-top">
            <div class="logo-icon">⚛️</div>
            <div>
                <div class="header-title">核自学生会 · 办事通</div>
                <div class="header-subtitle">成都理工大学 · 校园生活指南</div>
            </div>
        </div>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索你关心的问题，如：在读证明、医保、报修...">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
        </div>
    </div>

    <!-- ==================== 主内容区 ==================== -->
    <div class="container" id="cardContainer">

        <!-- 学业证明 -->
        <div class="section-title"><span class="dot"></span> 学业证明</div>
        <div class="card-grid" data-category="学业证明">
            <div class="card" data-id="zhiyin" onclick="openDetail('zhiyin')">
                <div class="card-icon icon-blue">📋</div>
                <h3>操作指引</h3>
                <p>可信电子凭证平台通用步骤</p>
            </div>
            <div class="card" data-id="lianjie" onclick="openDetail('lianjie')">
                <div class="card-icon icon-teal">🔗</div>
                <h3>直达链接</h3>
                <p>一键进入可信凭证平台</p>
            </div>
        </div>

        <!-- 生活服务 -->
        <div class="section-title"><span class="dot"></span> 生活服务</div>
        <div class="card-grid" data-category="生活服务">
            <div class="card" data-id="baoxiu" onclick="openDetail('baoxiu')">
                <div class="card-icon icon-orange">🔧</div>
                <h3>宿舍报修</h3>
                <p>成理智慧后勤报修</p>
            </div>
            <div class="card" data-id="chongdian" onclick="openDetail('chongdian')">
                <div class="card-icon icon-orange">💡</div>
                <h3>电费充值</h3>
                <p>学校缴费大厅充值</p>
            </div>
            <div class="card" data-id="xiaoyuanka" onclick="openDetail('xiaoyuanka')">
                <div class="card-icon icon-orange">💳</div>
                <h3>校园卡服务</h3>
                <p>挂失/充值/余额查询</p>
            </div>
        </div>

        <!-- 财务医保 -->
        <div class="section-title"><span class="dot"></span> 财务与医保</div>
        <div class="card-grid" data-category="财务医保">
            <div class="card" data-id="bangka" onclick="openDetail('bangka')">
                <div class="card-icon icon-green">🏦</div>
                <h3>银行卡绑定</h3>
                <p>奖助学金发放卡绑定</p>
            </div>
            <div class="card" data-id="yibao" onclick="openDetail('yibao')">
                <div class="card-icon icon-red">🏥</div>
                <h3>医保购买</h3>
                <p>成都税务缴费全流程</p>
            </div>
        </div>

        <div class="no-result" id="noResult">
            <div class="emoji">🔍</div>
            <p>未找到相关内容</p>
            <p style="font-size:12px;margin-top:4px;">试试其他关键词，如：证明、维修、医保</p>
        </div>
    </div>

    <div class="footer">
        成都理工大学 核技术与自动化工程学院 学生会 · 持续更新中
    </div>

    <!-- ==================== 详情弹窗 ==================== -->
    <div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
        <div class="detail-panel" id="detailPanel" onclick="event.stopPropagation()">
            <div class="detail-handle"></div>
            <div id="detailContent"></div>
            <button class="detail-close" onclick="closeDetailDirect()">关 闭</button>
        </div>
    </div>

                  <div class="step"><span class="step-num">②</span> 进入公众号，点击底部菜单 <strong>"教工服务"</strong></div>
                  <div class="step"><span class="step-num">③</span> 选择 <strong>"智能报销平台"</strong></div>
                  <div class="step"><span class="step-num">④</span> 进入后找到 <strong>"个人酬金卡号维护"</strong></div>
                  <div class="step"><span class="step-num">⑤</span> 填写本人名下状态正常的<strong>中国建设银行卡号</strong>，确认提交</div>
                  <div class="highlight-box">⚠️ 若建行卡丢失，请先去<strong>任意建行网点</strong>补办，再按上述步骤更新卡号。如遇问题可咨询学校财务处。</div>
                `
            },
            yibao: {
                title: '学生医保购买',
                category: '财务与医保',
                body: `
                  <p>如学校未统一代扣，可通过<strong>成都税务公众号</strong>自行购买。</p>
                  <div class="step"><span class="step-num">①</span> 微信搜索并关注公众号 <strong>"成都税务"</strong></div>
                  <div class="step"><span class="step-num">②</span> 点击底部菜单：<strong>我要办事</strong> → <strong>社保缴费</strong></div>
                  <div class="step"><span class="step-num">③</span> 选择缴费渠道（推荐<strong>成都农商银行</strong>，支持无卡支付）</div>
                  <div class="step"><span class="step-num">④</span> 输入个人信息，确认缴费年度为<strong>2026年</strong></div>
                  <div class="step"><span class="step-num">⑤</span> 选择缴费档次，向<strong>成华区税务局</strong>缴纳：<br>· 基本档：<strong>400元/年</strong><br>· 较高档：<strong>448元/年</strong></div>
                  <div class="highlight-box">
                    ⏰ <strong>生效时间：</strong>缴费之日起<strong>90天后生效</strong><br>
                    📅 <strong>有效期至：</strong>2026年12月31日<br>
                    ⚠️ <strong>务必提前购买！</strong>留足90天等待期，避免急需时无法使用。
                  </div>
                  <p style="font-size:12px;color:#999;">如已在老家参保，无需重复购买，但需办理异地就医备案才能在成都直接结算。</p>
                `
            }
        };

        // ==================== 打开详情弹窗 ====================
        function openDetail(id) {
            const data = cardData[id];
            if (!data) return;
            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
            <h2>${data.title}</h2>
            <div class="detail-category">${data.category}</div>
            <div class="detail-body">${data.body}</div>
          `;
            document.getElementById('detailOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            document.getElementById('detailPanel').scrollTop = 0;
        }

        function closeDetailDirect() {
            document.getElementById('detailOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        function closeDetail(event) {
            if (event.target === document.getElementById('detailOverlay')) {
                closeDetailDirect();
            }
        }

        // ==================== 搜索功能 ====================
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const noResult = document.getElementById('noResult');

        const keywordMap = {
            '在读证明': 'zhiyin',
            '证明': 'zhiyin',
            '成绩单': 'zhiyin',
            '中英文': 'zhiyin',
            '四六级': 'zhiyin',
            '绩点': 'zhiyin',
            '学历': 'zhiyin',
            '学位': 'zhiyin',
            '操作指引': 'zhiyin',
            '指引': 'zhiyin',
            '打印': 'zhiyin',
            '可信电子凭证': ['zhiyin', 'lianjie'],
            '可信认证': ['zhiyin', 'lianjie'],
            '砚湖易办': ['zhiyin', 'lianjie'],
            '直达': 'lianjie',
            '链接': 'lianjie',
            '平台': 'lianjie',
            '报修': 'baoxiu',
            '维修': 'baoxiu',
            '修理': 'baoxiu',
            '灯管': 'baoxiu',
            '水龙头': 'baoxiu',
            '成理智慧后勤': 'baoxiu',
            '后勤': 'baoxiu',
            '宿舍': ['baoxiu', 'chongdian'],
            '充电': 'chongdian',
            '电费': 'chongdian',
            '购电': 'chongdian',
            '缴费大厅': 'chongdian',
            '校园卡': 'xiaoyuanka',
            '一卡通': 'xiaoyuanka',
            '挂失': 'xiaoyuanka',
            '成理校园卡': 'xiaoyuanka',
            '流水': 'xiaoyuanka',
            '银行卡': 'bangka',
            '绑定': 'bangka',
            '建行': 'bangka',
            '奖助学金': 'bangka',
            '财务处': 'bangka',
            '酬金卡': 'bangka',
            '医保': 'yibao',
            '社保': 'yibao',
            '成都税务': 'yibao',
            '缴费': 'yibao',
            '400': 'yibao',
            '448': 'yibao',
            '成华区': 'yibao',
        };

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            searchClear.classList.toggle('visible', query.length > 0);
            if (query === '') {
                showAllCards();
                noResult.style.display = 'none';
                return;
            }

            let matchedIds = new Set();
            for (const [keyword, ids] of Object.entries(keywordMap)) {
                if (keyword.includes(query) || query.includes(keyword)) {
                    if (Array.isArray(ids)) {
                        ids.forEach(id => matchedIds.add(id));
                    } else {
                        matchedIds.add(ids);
                    }
                }
            }
            for (const [id, data] of Object.entries(cardData)) {
                if (data.title.toLowerCase().includes(query) ||
                    data.body.toLowerCase().includes(query) ||
                    data.category.toLowerCase().includes(query)) {
                    matchedIds.add(id);
                }
            }

            if (matchedIds.size === 0) {
                hideAllCards();
                noResult.style.display = 'block';
            } else {
                noResult.style.display = 'none';
                document.querySelectorAll('.card').forEach(card => {
                    const cardId = card.getAttribute('data-id');
                    card.style.display = matchedIds.has(cardId) ? '' : 'none';
                });
                updateSectionVisibility();
            }
        });

        function showAllCards() {
            document.querySelectorAll('.card').forEach(c => c.style.display = '');
            document.querySelectorAll('.section-title').forEach(s => s.style.display = '');
            document.querySelectorAll('.card-grid').forEach(g => g.style.display = '');
        }

        function hideAllCards() {
            document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
        }

        function updateSectionVisibility() {
            document.querySelectorAll('.card-grid').forEach(grid => {
                const allHidden = Array.from(grid.querySelectorAll('.card')).every(c => c.style.display === 'none');
                const prev = grid.previousElementSibling;
                if (allHidden && prev && prev.classList.contains('section-title')) {
                    prev.style.display = 'none';
                } else if (prev && prev.classList.contains('section-title')) {
                    prev.style.display = '';
                }
            });
        }

        function clearSearch() {
            searchInput.value = '';
            searchClear.classList.remove('visible');
            showAllCards();
            noResult.style.display = 'none';
            searchInput.focus();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDetailDirect();
        });
    </script>
</body>
</html>
